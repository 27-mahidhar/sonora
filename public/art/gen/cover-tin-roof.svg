</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<rect width="1000" height="1000" fill="url(#glow)"/>

        <circle cx="444" cy="657" r="384" fill="none" stroke="#ff9fb4" stroke-opacity="0.26" stroke-width="19.1"/>
