<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4a1226"/>
    <stop offset="70%" stop-color="#140308"/>
    <stop offset="100%" stop-color="#140308"/>
  </linearGradient>
  <radialGradient id="glow" cx="34%" cy="23%" r="72%">
    <stop offset="0%" stop-color="#ff9fb4" stop-opacity="0.78"/>
    <stop offset="55%" stop-color="#ff9fb4" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#ff9fb4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
    <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vig" cx="50%" cy="48%" r="76%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
