<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#123a22"/>
    <stop offset="70%" stop-color="#03120a"/>
    <stop offset="100%" stop-color="#03120a"/>
  </linearGradient>
  <radialGradient id="glow" cx="58%" cy="36%" r="72%">
    <stop offset="0%" stop-color="#8fe3a0" stop-opacity="0.78"/>
    <stop offset="55%" stop-color="#8fe3a0" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#8fe3a0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
    <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
